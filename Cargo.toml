[workspace]
resolver = "2"
members = ["solitaire-core", "solitaire-native", "solitaire-wasm"]
default-members = ["solitaire-core", "solitaire-native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
repository = "https://github.com/larsbrubaker/solitaire"

[workspace.dependencies]
agg-gui = "0.5"
agg-gui-wgpu = { version = "0.5.2", default-features = false }
agg-gui-shell = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

# ---------------------------------------------------------------------------
# Local development override — see CLAUDE.md "Local development uses agg-gui
# as a path dep". The rust-apps superproject lays out agg-gui as a sibling at
# ../agg-gui/. CI clones it the same way (see .github/workflows/ci.yml +
# deploy-demo.yml) so this patch resolves both locally and in Actions.
# The version requirements above must match the patched checkout (0.5.x) —
# a mismatched requirement makes a [patch] entry silently inert.
# ---------------------------------------------------------------------------
[patch.crates-io]
agg-gui = { path = "../agg-gui/agg-gui" }
agg-gui-wgpu = { path = "../agg-gui/agg-gui-wgpu" }
agg-gui-shell = { path = "../agg-gui/agg-gui-shell" }

# ---------------------------------------------------------------------------
# Optimize dependencies in debug builds. The agg-rust software rasterizer is
# expensive unoptimized — without this dev frame time drops sharply. Mirrors
# agg-gui's own workspace profile. `opt-level = 1` for the workspace itself:
# the renderer's inlined hot path monomorphizes into our crates, and at
# opt-level 0 frame times are ~10x worse (see agg-gui/docs/porting_update.md).
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
